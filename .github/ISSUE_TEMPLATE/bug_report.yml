name: Bug report
description: Report a reproducible problem in StashBase
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve StashBase. Review screenshots and logs before attaching them. Remove anything private; never include API keys, tokens, source documents, or Agent transcripts.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Paste the structured details prepared by Help → Report Bug… here.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Reviewed attachments
      description: Drag the prepared screenshot and recent log here only after reviewing them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed every attachment and removed private information.
          required: true
